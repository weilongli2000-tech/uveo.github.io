  <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sport Shopping · 运动商城</title>
<style>
:root{
  --ink:#15181c;--ink2:#1e2228;--paper:#f4f5f1;--line:#e4e6e0;
  --volt:#c6f035;--volt-d:#a9d61f;
  --price:#f04e23;--ok:#15803d;--danger:#dc2626;--muted:#6b7280;
  --shadow:0 1px 2px rgba(16,18,20,.06),0 10px 28px -12px rgba(16,18,20,.2);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.center{text-align:center}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.hint{font-size:12px;color:var(--muted)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.ic.fill{fill:currentColor;stroke:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;background:var(--ink);color:#fff;transition:.15s}
.btn:hover{background:#000}
.btn-volt{background:var(--volt);color:var(--ink)}
.btn-volt:hover{background:var(--volt-d)}
.btn-line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:6px}
.btn-lg{padding:13px 24px;font-size:15px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .hint{margin-top:4px}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink);outline:none}
.input:focus{border-color:var(--ink)}
textarea.input{min-height:96px;resize:vertical}
select.input{width:auto}
.auth-tabs{display:flex;background:var(--paper);border-radius:8px;padding:4px;margin-bottom:18px}
.auth-tabs button{flex:1;padding:9px;border:none;background:none;border-radius:6px;font-weight:700;font-size:14px;color:var(--muted)}
.auth-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.auth-msg{background:#fef3c7;color:#92400e;padding:8px 12px;border-radius:6px;font-size:13px;text-align:center;margin:0 0 14px}
.site-header{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff}
.head-in{display:flex;align-items:center;gap:18px;min-height:64px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;white-space:nowrap}
.logo .ic{color:var(--volt);width:24px;height:24px}
.logo b{color:var(--volt);margin-left:2px}
.search{flex:1;display:flex;max-width:440px}
.search input{flex:1;padding:9px 14px;border:none;border-radius:6px 0 0 6px;font-size:14px;outline:none;min-width:0}
.search button{border:none;background:var(--volt);color:var(--ink);border-radius:0 6px 6px 0;padding:0 14px;display:flex;align-items:center}
.head-nav{display:flex;align-items:center;gap:15px;font-size:14px;margin-left:auto}
.head-nav>a{opacity:.85;white-space:nowrap}
.head-nav>a:hover{opacity:1;color:var(--volt)}
.cart-link{position:relative;display:flex}
.cart-badge{position:absolute;top:-8px;right:-10px;background:var(--volt);color:var(--ink);font-size:11px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cart-badge:empty{display:none}
.admin-entry{display:flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.25);padding:5px 10px;border-radius:6px;font-size:12px;opacity:.9}
.admin-entry:hover{border-color:var(--volt);color:var(--volt)}
.u-menu{position:relative}
.u-menu summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.1);font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-menu summary::-webkit-details-marker{display:none}
.u-menu .menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink);border-radius:8px;box-shadow:var(--shadow);min-width:170px;padding:6px;z-index:60}
.u-menu .menu a,.u-menu .menu button{display:flex;width:100%;align-items:center;gap:8px;padding:9px 12px;font-size:13px;border:none;background:none;border-radius:6px;text-align:left;color:var(--ink)}
.u-menu .menu a:hover,.u-menu .menu button:hover{background:var(--paper)}
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-80px;top:0;bottom:0;width:340px;background:repeating-linear-gradient(-55deg,transparent 0 18px,rgba(198,240,53,.07) 18px 30px);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:58px 20px;position:relative;z-index:1}
.hero-tag{color:var(--volt);font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
.hero h1{font-size:52px;font-weight:900;line-height:1.15;margin:14px 0}
.hero h1 em{color:var(--volt);font-style:normal}
.hero p{color:#b6bbc2;font-size:16px;margin:0 0 26px;max-width:480px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-ghost{border-color:rgba(255,255,255,.35);color:#fff}
.hero-ghost:hover{border-color:#fff;background:transparent}
.hero-stats{display:flex;gap:28px;margin-top:34px}
.hero-stats b{font-size:22px;display:block}
.hero-stats span{font-size:12px;color:#9aa0a8}
.hero-grid{display:grid;grid-template-columns:repeat(2,minmax(0,150px));gap:16px;justify-content:end}
.htile{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;transform:rotate(-4deg)}
.htile:nth-child(2n){transform:rotate(3deg) translateY(14px)}
.sec{padding:34px 0 6px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sec-head h2{font-size:22px;font-weight:800;margin:0;display:flex;align-items:center;gap:10px}
.sec-head h2::before{content:'';width:6px;height:20px;background:var(--volt-d);border-radius:2px}
.sec-head a{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.sec-head a:hover{color:var(--ink)}
.sec-head a .ic{width:15px;height:15px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on a{color:#fff;opacity:.7}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pcard{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.18s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.12)}
.pimg{position:relative;aspect-ratio:1;background:#f0f1ec;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.ptags{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px}
.tag-hot{background:var(--price);color:#fff}
.tag-new{background:var(--volt);color:var(--ink)}
.soldout{position:absolute;inset:0;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:15px}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ph b{font-size:72px;font-weight:900;opacity:.3;line-height:1}
.ph span{font-size:12px;opacity:.55}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pname{font-size:14px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.pmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.stars{display:inline-flex;gap:1px}
.stars .ic{width:13px;height:13px;color:#d6d8d3}
.stars .ic.on{color:#f59e0b}
.pprice{margin-top:auto;display:flex;align-items:baseline;gap:8px}
.pprice b{color:var(--price);font-size:19px;font-weight:800}
.pprice s{color:var(--muted);font-size:13px;font-weight:400}
.site-footer{background:var(--ink);color:#9aa0a8;margin-top:56px}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1.2fr 1fr;gap:32px;padding:44px 20px 30px}
.foot-grid h4{color:#fff;font-size:14px;margin:0 0 12px}
.foot-grid a{display:block;font-size:13px;padding:4px 0;opacity:.85;cursor:pointer}
.foot-grid a:hover{opacity:1;color:var(--volt)}
.foot-brand{font-weight:900;font-size:17px;color:#fff;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.foot-brand .ic{color:var(--volt)}
.foot-brand b{color:var(--volt)}
.foot-note{font-size:12px;line-height:1.8;opacity:.75}
.pay-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.payb{padding:4px 10px;border-radius:4px;font-size:12px;font-weight:700;color:#fff}
.copyright{border-top:1px solid rgba(255,255,255,.08);padding:14px 20px;text-align:center;font-size:12px;opacity:.6}
.page{padding:30px 0 40px}
.page-title{font-size:24px;font-weight:800;margin:0 0 20px}
.shop{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.filters{background:#fff;border-radius:10px;padding:16px;position:sticky;top:84px}
.filters h4{margin:0 0 8px;font-size:13px}
.f-cat a,.f-sort a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;font-size:13px}
.f-cat a:hover,.f-sort a:hover{background:var(--paper)}
.f-cat a.on{background:var(--ink);color:#fff;font-weight:700}
.f-cat a.on .n{color:#b9bec6}
.f-sort a.on{background:var(--volt);font-weight:700}
.f-cat .n{color:var(--muted);font-size:12px}
.shop-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-height:34px}
.shop-count{color:var(--muted);font-size:13px}
.detail{display:grid;grid-template-columns:minmax(0,460px) 1fr;gap:36px;background:#fff;border-radius:12px;padding:28px}
.d-img{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#f0f1ec}
.d-img img{width:100%;height:100%;object-fit:cover}
.d-cat{font-size:12px;color:var(--muted)}
.d-info h1{font-size:25px;margin:6px 0 10px;line-height:1.3}
.d-rate{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted);padding-bottom:14px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.d-price{background:#fafaf6;border-radius:8px;padding:14px 16px;display:flex;align-items:baseline;gap:12px;margin:16px 0}
.d-price b{color:var(--price);font-size:32px;font-weight:900}
.d-price s{color:var(--muted)}
.d-price .tag{margin-left:auto}
.d-row{display:flex;align-items:center;gap:12px;margin:12px 0;flex-wrap:wrap}
.d-row .lbl{width:56px;color:var(--muted);font-size:13px;flex:none}
.stepper{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stepper button{width:34px;height:34px;border:none;background:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:var(--paper)}
.stepper .ic{width:14px;height:14px}
.stepper input{width:52px;text-align:center;border:none;outline:none;font-size:14px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.d-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.fav-btn{width:47px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
.fav-btn:hover{border-color:var(--price);color:var(--price)}
.fav-btn.on{color:var(--price);border-color:var(--price)}
.fav-btn.on .ic{fill:currentColor}
.d-services{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:16px;flex-wrap:wrap}
.d-services span{display:flex;align-items:center;gap:5px}
.d-services .ic{width:15px;height:15px;color:var(--ok)}
.desc-sec{margin-top:26px;background:#fff;border-radius:12px;padding:24px}
.desc-sec h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:10px}
.desc-sec h3::before{content:'';width:5px;height:16px;background:var(--volt-d);border-radius:2px}
.rev-sum{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rev-sum b{font-size:26px;font-weight:900}
.rev-item{border-top:1px solid var(--line);padding:14px 0}
.rev-head{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:6px}
.rev-head .who{font-weight:700}
.rev-head time{margin-left:auto;color:var(--muted);font-size:12px}
.rev-item p{margin:0;font-size:14px}
.cart-grid,.co-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.cart-line{display:grid;grid-template-columns:84px 1fr auto auto auto;gap:14px;align-items:center;background:#fff;padding:14px;border-radius:10px;margin-bottom:10px}
.thumb{width:84px;height:84px;border-radius:8px;overflow:hidden;background:#f0f1ec;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph b{font-size:24px}
.thumb .ph span{display:none}
.thumb.sm{width:56px;height:56px}
.thumb.sm .ph b{font-size:18px}
.thumb.xs{width:44px;height:44px}
.thumb.xs .ph b{font-size:15px}
.cl-name{font-weight:600;font-size:14px}
.cl-cat{font-size:12px;color:var(--muted)}
.cl-price{color:var(--muted);font-size:13px}
.cl-total{font-weight:800;min-width:76px;text-align:right}
.cl-del{border:none;background:none;color:var(--muted);padding:6px}
.cl-del:hover{color:var(--danger)}
.summary{background:#fff;border-radius:10px;padding:20px;position:sticky;top:84px}
.summary h3{margin:0 0 14px;font-size:15px}
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:5px 0}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:10px;padding-top:14px;font-weight:800;font-size:16px}
.sum-total b{color:var(--price);font-size:24px}
.co-block{background:#fff;border-radius:10px;padding:18px;margin-bottom:16px}
.co-block h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.co-block h3 .ic{width:17px;height:17px}
.co-block h3 .r{margin-left:auto}
.addr-card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
.addr-card:hover{border-color:#c9ccc2}
.addr-card.on{border-color:var(--ink);background:#fafaf6;box-shadow:inset 0 0 0 1px var(--ink)}
.addr-card input[type=radio]{margin-top:3px}
.addr-card .who{font-weight:700}
.addr-card .def{font-size:11px;background:var(--volt);border-radius:4px;padding:1px 6px;font-weight:700;margin-left:6px}
.addr-card p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.pay-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pay-opt{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.pay-opt:hover{border-color:#c9ccc2}
.pay-opt.on{border-color:var(--ink);background:#fafaf6;box-shadow:inset 0 0 0 1px var(--ink)}
.pay-logo{width:30px;height:30px;border-radius:6px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.pay-logo-lg{width:56px;height:56px;border-radius:14px;color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:6px auto 10px}
.pay-amount{font-size:34px;font-weight:900;text-align:center;margin:4px 0}
.pay-method{text-align:center;font-weight:700;margin:0}
.pay-no{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 14px}
.pay-note{background:#fef3c7;color:#92400e;font-size:12px;padding:8px 12px;border-radius:6px;line-height:1.6}
.otabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.otabs a{padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
.otabs a:hover{border-color:var(--ink)}
.otabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.otabs .n{opacity:.6;font-size:12px;margin-left:2px}
.ocard{background:#fff;border-radius:10px;margin-bottom:14px;overflow:hidden}
.ocard-head{display:flex;gap:14px;align-items:center;padding:11px 16px;background:#fafaf6;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.ono{font-weight:700;color:var(--ink);font-size:13px}
.ost{margin-left:auto}
.oitems{padding:4px 16px}
.oitem{display:grid;grid-template-columns:56px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.oitem:last-child{border:none}
.oitem .nm{font-size:14px;font-weight:600}
.oitem .qp{font-size:12px;color:var(--muted)}
.ocard-foot{display:flex;align-items:center;gap:10px;padding:12px 16px;justify-content:flex-end;flex-wrap:wrap}
.ototal{margin-right:auto;font-weight:800}
.ototal b{color:var(--price);font-size:19px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-pending_payment{background:#fef3c7;color:#92400e}
.st-paid{background:#dbeafe;color:#1d4ed8}
.st-shipped{background:#ede9fe;color:#6d28d9}
.st-completed{background:#dcfce7;color:#15803d}
.st-cancelled{background:#f3f4f6;color:#6b7280}
.b-super{background:var(--volt);color:var(--ink)}
.b-admin{background:#e3e8ef;color:#334155}
.b-on{background:#dcfce7;color:#15803d}
.b-off{background:#f3f4f6;color:#6b7280}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .ic{width:44px;height:44px;opacity:.25}
.empty b{color:var(--ink);font-size:16px;display:block;margin:12px 0 4px}
.empty p{margin:0 0 18px;font-size:13px}
.modal-mask{position:fixed;inset:0;background:rgba(10,12,14,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:440px;max-height:88vh;overflow:auto;box-shadow:0 24px 60px -12px rgba(0,0,0,.35)}
.modal-lg{max-width:600px}
.modal-head{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
.modal-head button{margin-left:auto;border:none;background:none;color:var(--muted);padding:4px}
.modal-head button:hover{color:var(--ink)}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#toast-root{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
body.admin-mode .site-header,body.admin-mode .site-footer{display:none}
.admin{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.admin-side{background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.admin-logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.admin-logo .ic{color:var(--volt)}

.toolbar .input{width:200px;padding:8px 12px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}

<script>
'use strict';
/* ============================================================
   Sport Shopping 运动商城 · 单文件本地版
   数据保存在浏览器 localStorage，无需服务器
   超级管理员：Weilong / lwl810qq（首次运行自动内置）
   ============================================================ */

// ---------------- 基础工具 ----------------
const $  = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.from((el||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtMoney = n => '¥' + (Math.round((+n||0)*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});
const fmtTime = ts => new Date(ts).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const fmtDay  = ts => { const d = new Date(ts); return (d.getMonth()+1)+'/'+d.getDate(); };
const icon = (n, cls) => '<svg class="ic '+(cls||'')+'"><use href="#i-'+n+'"/></svg>';

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  $('#toast-root').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 320); }, 2400);
}

const Modal = {
  _ok: null,
  open(html, lg){
    $('#modal-root').innerHTML = '<div class="modal-mask" onclick="App.maskClick(event)"><div class="modal '+(lg?'modal-lg':'')+'">'+html+'</div></div>';
  },
  close(){ $('#modal-root').innerHTML = ''; },
  confirm(title, text, okLabel, onOk){
    Modal._ok = onOk;
    Modal.open(
      '<div class="modal-head">'+esc(title)+'</div>'+
      '<div class="modal-body"><p style="margin:0;font-size:14px;line-height:1.8">'+esc(text)+'</p></div>'+
      '<div class="modal-foot"><button class="btn btn-line btn-sm" onclick="App.closeModal()">取消</button>'+
      '<button class="btn btn-danger btn-sm" onclick="App.confirmOk()">'+esc(okLabel||'确定')+'</button></div>'
    );

// ---------------- 密码哈希（SHA-256 + 随机盐，含降级） ----------------
async function sha(str){
  try{
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return 'f' + (h>>>0).toString(16);
}
async function makeCred(pwd){ const salt = uid('s'); return { salt: salt, hash: await sha(salt+'::'+pwd) }; }
async function verifyCred(acc, pwd){ return acc.hash === await sha(acc.salt+'::'+pwd); }

function num2cn(n){
  var units = ['','\u62fe','\u4f70','\u4edf','\u4e07','\u62fe','\u4f70','\u4edf','\u4ebf'];
  var digits = ['\u96f6','\u58f9','\u8d30','\u53c1','\u8086','\u4f0d','\u9646','\u67d2','\u634c','\u7396'];
  var s = String(Math.round(n*100));
  var yuan = s.slice(0,-2) || '0', jiao = s.slice(-2,-1) || '0', fen = s.slice(-1);
  var y = parseInt(yuan,10), j = parseInt(jiao,10), f = parseInt(fen,10);
  if(y===0 && j===0 && f===0) return '\u96f6\u5143\u6574';
  var r = '';
  if(y>0){ var t=y.toString(),len=t.length; for(var i=0;i<len;i++){ var d=parseInt(t[i],10); var u=units[len-i-1]; if(d===0){ if(r && r[r.length-1]!=='\u96f6' && i<len-1) r+='\u96f6'; } else { r+=digits[d]+u; } } r+='\u5143'; }
  if(j>0) r+=digits[j]+'\u89d2';
  if(f>0) r+=digits[f]+'\u5206';
  if(!r) r='\u96f6\u5143\u6574';
  return r;
}

/* ============================================================
   [支付接入点] 支付网关适配器 PaymentGateway
   ------------------------------------------------------------
   当前为 MOCK（模拟支付）模式，未接入真实支付平台。
   接入真实平台（支付宝 / 微信支付 / 银联 / Stripe 等）步骤：
     1. 准备一个你自己的服务端接口：用于向支付平台下单、验签
        （支付密钥绝对不能写在前端页面里）
     2. 调用 PaymentGateway.register('alipay', { createPayment, query, refund })
        注册你的平台实现（示例见下方注释与后台「系统设置」页）
     3. 调用 PaymentGateway.use('alipay') 切换到真实平台
     4. 支付平台异步到账回调由你的服务端验证后，通知前端调用
        PaymentGateway.handleNotify(订单号, 支付流水号)
        即可复用与模拟支付完全一致的入账逻辑（扣库存/记销量/改状态）
   在源码中搜索关键字：[支付接入点]
   ============================================================ */
function settleOrder(o, txnId){
  for(const it of o.items){
    const p = db.products.find(x=>x.id===it.pid);
    if(p){ p.stock = Math.max(0, p.stock - it.qty); p.sales = (p.sales||0) + it.qty; }
  }
  o.status = 'paid'; o.txnId = txnId; o.paidAt = Date.now();
  o.timeline.push({ ts:Date.now(), text:'支付成功' + (PaymentGateway.isMock()?'（模拟）':'') });
}
const PaymentGateway = (() => {
  const providers = {};
  let active = 'mock';
  providers.mock = {
    name:'模拟支付',
    async createPayment(order, method){
      await new Promise(r=>setTimeout(r, 600));
      return { ok:true, txnId:'MOCK-'+Date.now(), channel:method, amount:order.total, mock:true };
    },
    async query(txnId){ return { ok:true, txnId:txnId, status:'success', mock:true }; },
    async refund(txnId, amount){
      await new Promise(r=>setTimeout(r, 400));
      return { ok:true, refundId:'RF-'+Date.now(), amount:amount, mock:true };
    }
  };
  /* [支付接入点] 真实平台注册示例：
  providers.alipay = {
    name:'支付宝',
    async createPayment(order, method){
      const r = await fetch('https://你的服务端/api/pay/alipay', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ orderNo: order.no, amount: order.total })
      }).then(x=>x.json());
      return { ok:r.success, txnId:r.tradeNo };
    },
    async query(txnId){ ... },
    async refund(txnId, amount){ ... }
  };
  */
  return {
    register(name, impl){ providers[name] = impl; },   // [支付接入点] 注册真实平台
    use(name){ if(providers[name]) active = name; },   // [支付接入点] 切换支付平台
    activeName(){ return active; },
    isMock(){ return active === 'mock'; },
    async createPayment(order, method){ return providers[active].createPayment(order, method); },
    async query(txnId){ return providers[active].query(txnId); },
    async refund(txnId, amount){ return providers[active].refund(txnId, amount); },
    handleNotify(orderNo, txnId){                       // [支付接入点] 异步回调入账入口
      const o = db.orders.find(x=>x.no===orderNo);
      if(o && o.status==='pending_payment'){ settleOrder(o, txnId); save(); return true; }
      return false;
    }
  };
})();

function parseHash(){
  let h = location.hash.slice(1) || '/';
  const qi = h.indexOf('?');
  const query = {};
  if(qi >= 0){
    h.slice(qi+1).split('&').forEach(kv=>{
      if(!kv) return;
      const i = kv.indexOf('=');
      const k = i<0 ? kv : kv.slice(0,i);
      const v = i<0 ? '' : kv.slice(i+1);
      try{ query[decodeURIComponent(k)] = decodeURIComponent(v); }catch(e){ query[k]=v; }
    });
    h = h.slice(0, qi);
  }
  return { parts: h.split('/').filter(Boolean), query: query };
}

function fileToDataURL(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const s = Math.min(1, 900 / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => cb(null);
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function viewProducts(q){
  var cat = q.cat || '', kw = (q.q || '').trim(), tag = q.tag || '', sort = q.sort || 'default';
  var list = db.products.filter(function(p){ return p.status === 'on'; });
  if(cat) list = list.filter(function(p){ return p.cat === cat; });
  if(tag) list = list.filter(function(p){ return (p.tags||[]).includes(tag); });
  if(kw)  list = list.filter(function(p){ return p.name.includes(kw) || (p.desc||'').includes(kw) || p.cat.includes(kw); });
  var sorts = { sales: function(a,b){ return (b.sales||0)-(a.sales||0); }, price_asc: function(a,b){ return a.price-b.price; }, price_desc: function(a,b){ return b.price-a.price; }, newest: function(a,b){ return b.createdAt-a.createdAt; }, default: function(a,b){ return b.createdAt-a.createdAt; } };
  list.sort(sorts[sort] || sorts['default']);
  function countOf(c){ return db.products.filter(function(p){ return p.status==='on' && (!c || p.cat===c); }).length; }
  function mkLink(o){
    var p = {}; if(cat) p.cat=cat; if(kw) p.q=kw; if(o) Object.assign(p,o);
    return '#/products?' + Object.keys(p).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(p[k]); }).join('&');
  }
  var sOpts = [['default','\u7efc\u5408\u63a8\u8350'],['sales','\u9500\u91cf\u4f18\u5148'],['price_asc','\u4ef7\u683c\u4ece\u4f4e\u5230\u9ad8'],['price_desc','\u4ef7\u683c\u4ece\u9ad8\u5230\u4f4e'],['newest','\u6700\u65b0\u4e0a\u67b6']];
  return '<div class="page"><div class="wrap"><div class="shop"><aside class="filters">'+
    '<h4>\u5546\u54c1\u5206\u7c7b</h4><div class="f-cat">'+
    '<a class="' + (!cat?'on':'') + '" href="' + mkLink({cat:''}) + '">\u5168\u90e8<span class="n">' + countOf('') + '</span></a>'+
    CATS.map(function(c){ return '<a class="' + (cat===c?'on':'') + '" href="' + mkLink({cat:c})+'" data-nores="1">'+c+'<span class="n">'+countOf(c)+'</span></a>'; }).join('')+
    '</div><h4 style="margin-top:18px">\u6392\u5e8f\u65b9\u5f0f</h4><div class="f-sort">'+
    sOpts.map(function(a){ var v=a[0],l=a[1]; return '<a class="'+(sort===v?'on':'')+'" href="'+mkLink({sort:v})+'" data-nores="1">'+l+'</a>'; }).join('')+
    '</div></aside><div><div class="shop-top">'+
    (kw ? '<span class="chip on">\u201c' + esc(kw) + '\u201d <a href="' + mkLink({q:''}) + '" data-nores="1" style="opacity:.6">\u2715</a></span>' : '')+
    '<span class="shop-count">\u5171 ' + list.length + ' \u4ef6\u5546\u54c1</span></div>'+
    (list.length ? '<div class="pgrid">' + list.map(productCard).join('') + '</div>' : emptyState('box', '\u6ca1\u6709\u627e\u5230\u76f8\u5173\u5546\u54c1', '\u6362\u4e2a\u5173\u952e\u8bcd\u6216\u5206\u7c7b\u8bd5\u8bd5'))+
    '</div></div></div></div>';
}

    '<div class="d-rate">' + starRow(avg) + '<span>' + (rs.length ? rs.length + ' \u6761\u8bc4\u4ef7' : '\u6682\u65e0\u8bc4\u4ef7') + '</span><span>\u5df2\u552e ' + (p.sales||0) + ' \u4ef6</span>'+
    (soldOut ? '<span style="color:var(--danger);font-weight:700;margin-left:auto">\u5df2\u552e\u7f44</span>' : '<span style="margin-left:auto">\u5e93\u5b58 ' + p.stock + ' \u4ef6</span>') + '</div>'+

    (soldOut ? '' :
    '<div class="d-row"><span class="lbl">\u6570\u91cf</span><div class="stepper"><button onclick="App.dStep(-1)"'+(detailQty<=1?' disabled':'')+'>' + icon('minus') + '</button><input id="dqty" type="number" value="1" min="1" max="' + detailMax + '" oninput="App.dSet(this.value)"><button onclick="App.dStep(1)"'+(detailQty>=detailMax?' disabled':'')+'>'+icon('plus')+'</button></div></div>')+

    '<button class="btn btn-volt btn-lg" onclick="App.buyNow(\''+p.id+'\')">\u7acb\u5373\u8d2d\u4e70</button>')+
    '<button class="btn fav-btn' + (fav?' on':'') + '" onclick="App.toggleFav(\''+p.id+'\')">'+icon('heart', (fav?'fill':''))+'</button></div>'+
    '<div class="d-services"><span>'+icon('check')+'\u6b63\u54c1\u4fdd\u969c</span><span>'+icon('truck')+'\u6781\u901f\u53d1\u8d27</span><span>'+icon('check')+'7\u5929\u65e0\u7406\u7531\u9000\u6362</span></div></div></div>'+
    (p.desc ? '<div class="desc-sec"><h3>\u5546\u54c1\u63cf\u8ff0</h3><p style="font-size:14px;line-height:1.9;color:var(--ink2)">'+esc(p.desc)+'</p></div>' : '')+
    '<div class="desc-sec"><h3>\u5546\u54c1\u8bc4\u4ef7 (' + rs.length + ')</h3>'+
    (rs.length ? '<div class="rev-sum"><b>' + avg.toFixed(1) + '</b>' + starRow(avg) + '<span class="muted">' + rs.length + ' \u6761\u8bc4\u4ef7</span></div>' +
    rs.slice().reverse().map(function(r){ return '<div class="rev-item"><div class="rev-head"><span class="who">'+esc(r.username)+'</span>'+starRow(r.rating)+'<time>'+fmtTime(r.createdAt)+'</time></div><p>'+esc(r.content)+'</p></div>'; }).join('') : '<p class="muted">\u6682\u65e0\u8bc4\u4ef7\uff0c\u4e70\u5bb6\u53ef\u5728\u786e\u8ba4\u6536\u8d27\u540e\u5199\u8bc4\u4ef7</p>')+
    (canRev ? '<button class="btn btn-volt btn-sm" style="margin-top:10px" onclick="App.openReviewFrom(\''+p.id+'\')">\u5199\u8bc4\u4ef7</button>' : '') +

  var total = 0;

    var lt = p.price * i.qty; total += lt;
    rows += '<div class="cart-line">' + thumb(p.img, p.cat, '') +
      '<div><div class="cl-name">' + esc(p.name) + '</div><div class="cl-cat">' + p.cat + '</div></div>'+

function orderCard(o){
  var revChecked = function(pid){ return db.reviews.some(function(r){ return r.orderId===o.id && r.pid===pid; }); };
  var acts = '';
  if(o.status === 'pending_payment') acts = '<button class="btn btn-volt btn-sm" onclick="App.payOrder(\''+o.id+'\')">\u53bb\u652f\u4ed8</button><button class="btn btn-line btn-sm" onclick="App.cancelOrder(\''+o.id+'\')">\u53d6\u6d88\u8ba2\u5355</button>';
  else if(o.status === 'paid') acts = '<span class="muted">\u7b49\u5f85\u5546\u5bb6\u53d1\u8d27</span>';
  else if(o.status === 'shipped') acts = '<button class="btn btn-volt btn-sm" onclick="App.confirmReceive(\''+o.id+'\')">\u786e\u8ba4\u6536\u8d27</button>';
  else if(o.status === 'completed'){
    acts = '<span class="badge st-completed">\u5df2\u5b8c\u6210</span>';
    o.items.forEach(function(it){ if(!revChecked(it.pid)) acts += '<button class="btn btn-line btn-sm" onclick="App.openReview(\''+o.id+'\',\''+it.pid+'\')">\u8bc4\u4ef7\u300c'+esc(it.name)+'\u300d</button>'; });
  }
  return '<div class="ocard"><div class="ocard-head"><span class="ono">'+o.no+'</span><time>'+fmtTime(o.createdAt)+'</time><span class="ost">'+orderBadge(o.status)+'</span></div>'+
    '<div class="oitems">' + o.items.map(function(i){ return '<div class="oitem">'+thumb(i.img, i.cat||'', 'sm')+'<div><div class="nm">'+esc(i.name)+'</div><div class="qp">'+fmtMoney(i.price)+' x '+i.qty+'</div></div><span class="muted">'+fmtMoney(i.price*i.qty)+'</span></div>'; }).join('') + '</div>'+
    '<div class="ocard-foot"><span class="ototal">\u5408\u8ba1\uff1a<b>'+fmtMoney(o.total)+'</b></span>' + acts + '</div></div>';
}

function viewAdminLogin(){
  return '<div class="admin-login"><div class="al-card"><div class="al-logo">'+icon('bolt','fill')+' SPORT<b>SHOPPING</b></div>'+
    '<h1>\u7ba1\u7406\u540e\u53f0</h1><p>\u4ec5\u9650\u6388\u6743\u7ba1\u7406\u5458\u767b\u5f55</p>'+
    '<form onsubmit="return App.adminLoginSubmit(event)"><div class="field"><label>\u7ba1\u7406\u5458\u8d26\u53f7</label><input class="input" name="u" required></div>'+
    '<div class="field"><label>\u5bc6\u7801</label><input class="input" type="password" name="p" required></div>'+
    '<button class="btn btn-volt btn-block btn-lg">\u8fdb\u5165\u540e\u53f0</button></form>'+
    '<a class="al-back" href="#/">'+icon('arrow')+' \u8fd4\u56de\u5546\u57ce\u9996\u9875</a></div></div>';
}

function renderAdmin(section, rest, q){
  var a = currentAdmin();
  if(!a){ document.getElementById('view').innerHTML = viewAdminLogin(); return; }
  var isSuper = a.role === 'super';
  var nav = [['dashboard','\u6570\u636e\u603b\u89c8','chart'],['products','\u5546\u54c1\u7ba1\u7406','box'],['orders','\u8ba2\u5355\u7ba1\u7406','truck'],['users','\u7528\u6237\u7ba1\u7406','users']];
  if(isSuper) nav.push(['admins','\u7ba1\u7406\u5458\u7ba1\u7406','shield']);
  nav.push(['settings','\u7cfb\u7edf\u8bbe\u7f6e','settings']);
  nav.push(['docs','\u5355\u636e\u7ba1\u7406','truck']);
  var content;
  if(section === 'product-new') content = viewProductForm(null);
  else if(section === 'product-edit') content = viewProductForm(rest[0]);
  else {
    var map = { dashboard: viewAdminDashboard, products: function(){ return viewAdminProducts(q); }, orders: function(){ return viewAdminOrders(q); }, users: viewAdminUsers, admins: function(){ return isSuper ? viewAdminAdmins() : '<p class="muted">\u65e0\u6743\u9650\u8bbf\u95ee</p>'; }, docs: function(){ return viewAdminDocs(q); },
    settings: viewAdminSettings };
    content = (map[section] || viewAdminDashboard)();
  }
  var titles = { dashboard:'\u6570\u636e\u603b\u89c8', products:'\u5546\u54c1\u7ba1\u7406', 'product-new':'\u65b0\u5efa\u5546\u54c1', 'product-edit':'\u7f16\u8f91\u5546\u54c1', orders:'\u8ba2\u5355\u7ba1\u7406', users:'\u7528\u6237\u7ba1\u7406', admins:'\u7ba1\u7406\u5458\u7ba1\u7406', docs:'\u5355\u636e\u7ba1\u7406',
    settings:'\u7cfb\u7edf\u8bbe\u7f6e' };
  var activeSection = section;
  if(section==='product-new'||section==='product-edit') activeSection='products';
  document.getElementById('view').innerHTML = '<div class="admin"><aside class="admin-side">'+
    '<a class="admin-logo" href="#/">'+icon('bolt','fill')+' SPORT<b>SHOPPING</b></a><nav class="anav">'+
    nav.map(function(n){ return '<a class="'+(activeSection===n[0]?'on':'')+'" href="#/admin/'+n[0]+'">'+icon(n[2])+n[1]+'</a>'; }).join('')+'</nav>'+
    '<div class="side-foot"><a href="#/">'+icon('home')+'\u8fd4\u56de\u5546\u57ce</a><button onclick="App.adminLogout()">'+icon('logout')+'\u9000\u51fa\u767b\u5f55</button></div></aside>'+
    '<main class="admin-main"><div class="admin-top"><h1>'+(titles[section]||'\u6570\u636e\u603b\u89c8')+'</h1><div class="admin-chip">'+icon('shield')+' ' + esc(a.username) +
    ' <span class="badge '+(isSuper?'b-super':'b-admin')+'">'+(isSuper?'\u8d85\u7ea7\u7ba1\u7406\u5458':'\u7ba1\u7406\u5458')+'</span><button class="tbtn" onclick="App.adminLogout()">'+icon('logout')+'\u9000\u51fa</button></div></div>'+content+'</main></div>';
}

function viewAdminDashboard(){
  var valid = db.orders.filter(function(o){ return PAID_ST.includes(o.status); });
  var rev = valid.reduce(function(s,o){ return s+o.total; }, 0);
  var todayStr = new Date().toDateString();
  var todayCnt = db.orders.filter(function(o){ return new Date(o.createdAt).toDateString()===todayStr; }).length;
  var toShip = db.orders.filter(function(o){ return o.status==='paid'; }).length;
  var onCnt = db.products.filter(function(p){ return p.status==='on'; }).length;
  var weeks = [];
  for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); var ds=d.toDateString(); weeks.push({label:fmtDay(d.getTime()),sum:valid.filter(function(o){ return new Date(o.paidAt||o.createdAt).toDateString()===ds; }).reduce(function(s,o){return s+o.total;},0)}); }
  var wMax = Math.max(1, Math.max.apply(null, weeks.map(function(w){ return w.sum; })));
  var chartHtml = '<div class="chart">'+weeks.map(function(w){ return '<div class="col"><div class="bar" style="height:'+(wMax?Math.max(4,w.sum/wMax*150):4)+'px" title="'+fmtMoney(w.sum)+'"></div><div class="lbl">'+w.label+'</div></div>'; }).join('')+'</div>';
  var rOrders = db.orders.slice().sort(function(a,b){ return b.createdAt-a.createdAt; }).slice(0,5);
  var top5 = db.products.slice().sort(function(a,b){ return (b.sales||0)-(a.sales||0); }).slice(0,5);
  var topMax = Math.max(1, top5[0] ? (top5[0].sales||0) : 0);
  return '<div class="stat-grid"><div class="stat"><div class="k">\u7d2f\u8ba1\u9500\u552e\u989d</div><div class="v">'+fmtMoney(rev)+'</div><div class="sub">\u6709\u6548\u8ba2\u5355 '+valid.length+' \u7b14</div></div>'+
    '<div class="stat"><div class="k">\u7d2f\u8ba1\u8ba2\u5355</div><div class="v">'+db.orders.length+'</div><div class="sub">\u4eca\u65e5\u65b0\u589e '+todayCnt+'</div></div>'+
    '<div class="stat"><div class="k">\u5f85\u53d1\u8d27</div><div class="v">'+toShip+'</div><div class="sub">'+(toShip?'\u9700\u8981\u5c3d\u5feb\u5904\u7406':'\u5168\u90e8\u5904\u7406\u5b8c\u6bd5')+'</div></div>'+
    '<div class="stat"><div class="k">\u5728\u552e\u5546\u54c1</div><div class="v">'+onCnt+' / '+db.products.length+'</div><div class="sub">\u5728\u552e / \u603b\u6570</div></div>'+
    '<div class="stat"><div class="k">\u6ce8\u518c\u7528\u6237</div><div class="v">'+db.users.length+'</div></div></div>'+
    '<div class="panel"><h3>7\u65e5\u9500\u552e\u989d</h3>'+chartHtml+'</div>'+
    '<div class="panel"><h3>\u6700\u65b0\u8ba2\u5355</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>\u8ba2\u5355\u53f7</th><th>\u4e70\u5bb6</th><th>\u91d1\u989d</th><th>\u72b6\u6001</th><th>\u65f6\u95f4</th><th></th></tr></thead><tbody>'+
    rOrders.map(function(o){ return '<tr><td class="nm">'+o.no+'</td><td>'+esc(o.username)+'</td><td>'+fmtMoney(o.total)+'</td><td>'+orderBadge(o.status)+'</td><td>'+fmtTime(o.createdAt)+'</td><td><button class="tbtn" onclick="App.orderDetail(\''+o.id+'\')">'+icon('eye')+'\u8be6\u60c5</button></td></tr>'; }).join('')+'</tbody></table></div></div>'+
    '<div class="panel"><h3>\u70ed\u5356\u5546\u54c1 TOP5</h3>'+top5.map(function(p,i){ return '<div class="mrow"><div class="thumb xs">'+(p.img?'<img src="'+esc(p.img)+'" alt="">':phTile(p.cat))+'</div><span class="grow">'+esc(p.name)+'</span><span style="min-width:60px;text-align:right">\u5df2\u552e '+(p.sales||0)+'</span><div class="mbar" style="width:'+((p.sales||0)/topMax*200)+'px"></div></div>'; }).join('')+'</div>';
}

function viewAdminProducts(q){
  var kw = (q.q||'').trim(), st = q.st||'';
  var list = db.products.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
  if(kw) list = list.filter(function(p){ return p.name.includes(kw); });
  if(st) list = list.filter(function(p){ return p.status===st; });
  return '<div class="toolbar"><form onsubmit="return App.adminProdSearch(event)"><input class="input" id="apq" name="q" value="'+esc(kw)+'" placeholder="\u641c\u7d22\u5546\u54c1\u2026"></form>'+
    '<select class="input" onchange="App.adminProdSt(this.value)" style="width:auto"><option value="">\u5168\u90e8\u72b6\u6001</option><option value="on"'+ (st==='on'?' selected':'')+'>\u5728\u552e</option><option value="off"'+ (st==='off'?' selected':'')+'>\u5df2\u4e0b\u67b6</option></select>'+
    '<span class="spacer"></span><a class="btn btn-volt btn-sm" href="#/admin/product-new">'+icon('plus')+'\u65b0\u5efa\u5546\u54c1</a></div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>\u56fe</th><th>\u540d\u79f0</th><th>\u5206\u7c7b</th><th>\u4ef7\u683c</th><th>\u5e93\u5b58</th><th>\u9500\u91cf</th><th>\u72b6\u6001</th><th>\u64cd\u4f5c</th></tr></thead><tbody>'+
    list.map(function(p){ return '<tr><td>'+thumb(p.img, p.cat, 'xs')+'</td><td class="nm">'+esc(p.name)+'</td><td>'+p.cat+'</td><td>'+fmtMoney(p.price)+'</td><td>'+p.stock+'</td><td>'+(p.sales||0)+'</td>'+
    '<td><span class="badge '+(p.status==='on'?'b-on':'b-off')+'">'+(p.status==='on'?'\u5728\u552e':'\u5df2\u4e0b\u67b6')+'</span></td>'+
    '<td><div class="tbl-actions"><button class="tbtn" onclick="App.prodToggle(\''+p.id+'\')">'+(p.status==='on'?'\u4e0b\u67b6':'\u4e0a\u67b6')+'</button>'+
    '<a class="tbtn" href="#/admin/product-edit/'+p.id+'">'+icon('edit')+'</a>'+
    '<button class="tbtn danger" onclick="App.prodDelete(\''+p.id+'\')">'+icon('trash')+'</button></div></td></tr>'; }).join('')+'</tbody></table></div>';
}

function viewProductForm(id){
  var p = id ? db.products.find(function(x){ return x.id===id; }) : null;
  draftImg = (p && p.img && p.img.indexOf('http')===0) ? '' : (p ? p.img : '');
  return '<div style="max-width:860px"><a class="btn btn-line btn-sm" href="#/admin/products">'+icon('arrow')+'\u8fd4\u56de\u5546\u54c1\u5217\u8868</a>'+
    '<form onsubmit="return App.prodSave(event,\''+(id||'')+'\')" style="margin-top:16px"><div class="form-grid">'+
    '<div class="field full"><label>\u5546\u54c1\u540d\u79f0 *</label><input class="input" name="name" required value="'+esc(p?p.name:'')+'"></div>'+
    '<div class="field"><label>\u5206\u7c7b *</label><select class="input" name="cat" required>'+CATS.map(function(c){ return '<option value="'+c+'"'+ (p&&p.cat===c?' selected':'')+'>'+c+'</option>'; }).join('')+'</select></div>'+
    '<div class="field"><label>\u4ef7\u683c\uff08\u5143\uff09 *</label><input class="input" type="number" name="price" min="0" step="1" required value="'+(p?p.price:'')+'"></div>'+
    '<div class="field"><label>\u539f\u4ef7\uff08\u5143\uff09</label><input class="input" type="number" name="orig" min="0" step="1" value="'+(p?p.orig:'')+'"></div>'+
    '<div class="field"><label>\u5e93\u5b58 *</label><input class="input" type="number" name="stock" min="0" step="1" required value="'+(p?p.stock:'')+'"></div>'+
    '<div class="field"><label>\u72b6\u6001</label><select class="input" name="st"><option value="on"'+ (p&&p.status==='on'||!p?' selected':'')+'>\u4e0a\u67b6\u5728\u552e</option><option value="off"'+ (p&&p.status==='off'?' selected':'')+'>\u4e0b\u67b6</option></select></div>'+
    '<div class="field full"><label>\u6807\u7b7e</label><label class="tag-check"><input type="checkbox" name="tag_hot"'+ (p&&(p.tags||[]).includes('hot')?' checked':'')+'>\u70ed\u5356</label><label class="tag-check"><input type="checkbox" name="tag_new"'+(p&&(p.tags||[]).includes('new')?' checked':'')+'>\u65b0\u54c1</label></div>'+
    '<div class="field full"><label>\u63cf\u8ff0</label><textarea class="input" name="desc" rows="3">'+esc(p?p.desc||'':'')+'</textarea></div>'+
    '<div class="field full"><label>\u5546\u54c1\u56fe\u7247</label><div class="img-up"><div class="img-preview" id="pimgPrev">'+(p&&p.img?'<img src="'+esc(p.img)+'" alt="">':'<div class="ph"><b>?</b><span>\u9009\u62e9\u56fe\u7247\u6216\u7c98\u8d34\u94fe\u63a5</span></div>')+'</div><div style="flex:1;min-width:200px"><label class="btn btn-line btn-sm up-btn">' + icon('upload') + ' \u672c\u5730\u4e0a\u4f20 <input type="file" accept="image/*" onchange="App.prodImgFile(event)"></label><div class="hint" style="margin:8px 0">\u6216\u76f4\u63a5\u7c98\u8d34\u56fe\u7247\u94fe\u63a5\uff1a</div><input class="input" id="pimgUrl" name="imgurl" placeholder="https://..." value="' + esc(p&&p.img&&p.img.indexOf('http')===0?p.img:'') + '" oninput="App.prodImgUrl(this.value)"></div></div></div>'+
    '<div class="field full" style="margin-top:16px"><button class="btn btn-volt btn-lg">\u4fdd\u5b58\u5546\u54c1</button></div></div></form></div>';
}

function viewAdminOrders(q){
  var st = q.st || 'all';
  var list = db.orders.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
  if(st !== 'all') list = list.filter(function(o){ return o.status===st; });
  function cnt(s){ return s==='all' ? db.orders.length : db.orders.filter(function(o){ return o.status===s; }).length; }
  var tabs = [['all','\u5168\u90e8'],['pending_payment','\u5f85\u4ed8\u6b3e'],['paid','\u5f85\u53d1\u8d27'],['shipped','\u5df2\u53d1\u8d27'],['completed','\u5df2\u5b8c\u6210'],['cancelled','\u5df2\u53d6\u6d88']];
  var payName = {alipay:'\u652f\u4ed8\u5b9d',wechat:'\u5fae\u4fe1\u652f\u4ed8',unionpay:'\u94f6\u8054'};
  return '<div class="otabs">' + tabs.map(function(t){ return '<a class="'+(st===t[0]?'on':'')+'" href="#/admin/orders?st='+t[0]+'">'+t[1]+'<span class="n">'+cnt(t[0])+'</span></a>'; }).join('') + '</div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>\u8ba2\u5355\u53f7</th><th>\u4e70\u5bb6</th><th>\u91d1\u989d</th><th>\u652f\u4ed8\u65b9\u5f0f</th><th>\u72b6\u6001</th><th>\u65f6\u95f4</th><th>\u64cd\u4f5c</th></tr></thead><tbody>'+
    list.map(function(o){ return '<tr><td class="nm">'+o.no+'</td><td>'+esc(o.username)+'</td><td>'+fmtMoney(o.total)+'</td><td>'+(payName[o.payMethod]||o.payMethod)+'</td><td>'+orderBadge(o.status)+'</td><td>'+fmtTime(o.createdAt)+'</td>'+
    '<td><div class="tbl-actions"><button class="tbtn" onclick="App.orderDetail(\''+o.id+'\')">'+icon('eye')+'\u8be6\u60c5</button>'+
    (o.status==='paid'?'<button class="tbtn solid" onclick="App.adminShip(\''+o.id+'\')">'+icon('truck')+'\u53d1\u8d27</button>':'')+
    ((o.status==='pending_payment'||o.status==='paid')?'<button class="tbtn danger" onclick="App.adminCancel(\''+o.id+'\')">'+icon('x')+'\u53d6\u6d88</button>':'')+
    '</div></td></tr>'; }).join('')+'</tbody></table></div>';
}

function orderDetailModal(oid){
  var o = db.orders.find(function(x){ return x.id===oid; }); if(!o) return;
  var payName = {alipay:'\u652f\u4ed8\u5b9d',wechat:'\u5fae\u4fe1\u652f\u4ed8',unionpay:'\u94f6\u8054'};
  Modal.open('<div class="modal-head">\u8ba2\u5355\u8be6\u60c5<button onclick="App.closeModal()">'+icon('x')+'</button></div>'+
    '<div class="modal-body"><div class="kv"><dt>\u8ba2\u5355\u53f7</dt><dd>'+o.no+'</dd><dt>\u4e70\u5bb6</dt><dd>'+esc(o.username)+'</dd><dt>\u91d1\u989d</dt><dd><b>'+fmtMoney(o.total)+'</b></dd><dt>\u652f\u4ed8\u65b9\u5f0f</dt><dd>'+ (payName[o.payMethod]||o.payMethod) + (PaymentGateway.isMock()?' <span class="badge st-pending_payment">\u6a21\u62df\u652f\u4ed8</span>':'') + '</dd><dt>\u6d41\u6c34\u53f7</dt><dd>'+ (o.txnId||'\u2014') + '</dd><dt>\u6536\u8d27\u4eba</dt><dd>'+esc(o.address.name)+' '+esc(o.address.phone)+'</dd><dt>\u5730\u5740</dt><dd>'+esc(o.address.region+' '+o.address.detail)+'</dd></div>'+
    '<h4 style="margin:14px 0 6px;font-size:13px">\u5546\u54c1\u660e\u7ec6</h4>'+o.items.map(function(i){ return '<div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><div class="thumb xs">'+(i.img?'<img src="'+esc(i.img)+'" alt="">':phTile(i.cat||''))+'</div><span style="flex:1">'+esc(i.name)+'<br><span class="muted">'+fmtMoney(i.price)+' x '+i.qty+'</span></span><span>'+fmtMoney(i.price*i.qty)+'</span></div>'; }).join('')+
    '<h4 style="margin:14px 0 6px;font-size:13px">\u8ba2\u5355\u65e5\u5fd7</h4><ul class="tl">'+(o.timeline||[]).map(function(t){ return '<li><b>'+t.text+'</b><time>'+fmtTime(t.ts)+'</time></li>'; }).join('')+'</ul></div>', true);
}

function viewAdminUsers(){
  var list = db.users.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
  function oCnt(uid){ return db.orders.filter(function(o){ return o.userId===uid; }).length; }
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>\u7528\u6237\u540d</th><th>\u624b\u673a</th><th>\u8ba2\u5355\u6570</th><th>\u6ce8\u518c\u65f6\u95f4</th><th>\u72b6\u6001</th><th>\u64cd\u4f5c</th></tr></thead><tbody>'+
    list.map(function(u){ return '<tr><td class="nm">'+esc(u.username)+'</td><td>'+esc(u.phone||'\u2014')+'</td><td>'+oCnt(u.id)+'</td><td>'+fmtTime(u.createdAt)+'</td><td><span class="badge '+(u.status==='active'?'b-on':'b-off')+'">'+(u.status==='active'?'\u6b63\u5e38':'\u5df2\u7981\u7528')+'</span></td>'+
    '<td><button class="tbtn" onclick="App.userToggle(\''+u.id+'\')">'+(u.status==='active'?'\u7981\u7528':'\u542f\u7528')+'</button></td></tr>'; }).join('')+'</tbody></table></div>';
}

function viewAdminAdmins(){
  return '<div class="toolbar"><button class="btn btn-volt btn-sm" onclick="App.openAdminAdd()">'+icon('plus')+'\u65b0\u5efa\u7ba1\u7406\u5458</button></div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>\u8d26\u53f7</th><th>\u89d2\u8272</th><th>\u72b6\u6001</th><th>\u521b\u5efa\u65f6\u95f4</th><th>\u64cd\u4f5c</th></tr></thead><tbody>'+

    '<td><span class="badge '+(a.status==='active'?'b-on':'b-off')+'">'+(a.status==='active'?'\u6b63\u5e38':'\u5df2\u7981\u7528')+'</span></td><td>'+fmtTime(a.createdAt)+'</td>'+
    '<td>'+(isS?'<span class="muted">\u2014</span>':'<div class="tbl-actions"><button class="tbtn" onclick="App.openAdminReset(\''+a.id+'\')">\u91cd\u7f6e\u5bc6\u7801</button>'+
    '<button class="tbtn" onclick="App.adminToggle(\''+a.id+'\')">'+(a.status==='active'?'\u7981\u7528':'\u542f\u7528')+'</button><button class="tbtn danger" onclick="App.adminDelete(\''+a.id+'\')">'+icon('trash')+'</button></div>')+'</td></tr>'; }).join('')+'</tbody></table></div>';
}

function viewAdminDocs(q){
  var list = db.orders.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
  var info = db.companyInfo || {};
  var hasInfo = info.name && info.address && info.phone;
  return '<div class="panel"><h3>'+icon('settings')+' \u516c\u53f8\u4fe1\u606f\u8bbe\u7f6e</h3>'+
    '<p class="hint">\u8bf7\u5148\u586b\u5199\u516c\u53f8\u4fe1\u606f\uff0c\u7136\u540e\u5bf9\u8ba2\u5355\u751f\u6210\u62a5\u4ef7\u5355\u3001\u9001\u8d27\u5355\u3001\u9a8c\u6536\u5355\u3002</p>'+

function render(){
  var h = parseHash(), r = h.parts[0] || '', q = h.query;
  window.scrollTo(0, 0);
  document.body.classList.toggle('admin-mode', r === 'admin');
  if(r === 'admin'){ renderAdmin(h.parts[1] || 'dashboard', h.parts.slice(2), q); updateHeader(); return; }
  var html;
  switch(r){
    case '': html = viewHome(); break;
    case 'products': html = viewProducts(q); break;
    case 'product': html = viewDetail(h.parts[1]); break;
    case 'cart': html = viewCart(); break;
    case 'checkout': html = viewCheckout(); break;
    case 'orders': html = viewOrders(q); break;
    case 'favorites': html = viewFavorites(); break;
    case 'profile': html = viewProfile(); break;
    default: html = notFound();
  }
  document.getElementById('view').innerHTML = html;
  updateHeader();
  var si = document.getElementById('searchInput');
  if(si){ si.value = ''; } // sync: later set by each view if needed
}

  genDoc: function(oid, type){
    var o = db.orders.find(function(x){ return x.id===oid; }); if(!o) return;
    var info = db.companyInfo || {};
    var now = new Date();
    var ds = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    var titles = { quotation: '\u62a5\u4ef7\u5355', delivery: '\u9001\u8d27\u5355', acceptance: '\u9a8c\u6536\u5355' };
    var t = titles[type] || type;

    var itemsHtml = '<table><thead><tr><th>\u5e8f\u53f7</th><th>\u5546\u54c1\u540d\u79f0</th><th>\u89c4\u683c</th><th>\u5355\u4f4d</th><th>\u6570\u91cf</th><th>\u5355\u4ef7</th><th>\u91d1\u989d</th></tr></thead><tbody>'+
      o.items.map(function(it,i){ return '<tr><td>'+(i+1)+'</td><td>'+esc(it.name)+'</td><td>\u2014</td><td>\u4ef6</td><td>'+it.qty+'</td><td>'+fmtMoney(it.price)+'</td><td>'+fmtMoney(it.price*it.qty)+'</td></tr>'; }).join('')+
      '<tr><td colspan="6" style="text-align:right;font-weight:700">\u5408\u8ba1\uff08\u5927\u5199\uff09\uff1a'+num2cn(o.total)+'</td><td style="font-weight:700">'+fmtMoney(o.total)+'</td></tr></tbody></table>';

    var addr = o.address || {};
    var receiver = esc(addr.name||'') + '  ' + esc(addr.phone||'') + '  ' + esc((addr.region||'')+(addr.detail||''));

    var footerText = '';
    if(type === 'quotation'){
      footerText = '<p>\u5907\u6ce8\uff1a1. \u672c\u62a5\u4ef7\u5355\u6709\u6548\u671f 30 \u5929\u3002 2. \u4ed8\u6b3e\u65b9\u5f0f\uff1a\u94f6\u884c\u8f6c\u8d26\u3002 3. \u4ea4\u8d27\u671f\uff1a\u786e\u8ba4\u540e 3-7 \u4e2a\u5de5\u4f5c\u65e5\u3002</p>';
    } else if(type === 'delivery'){
      footerText = '<p>\u5907\u6ce8\uff1a1. \u8bf7\u6536\u8d27\u65f6\u5f53\u573a\u68c0\u67e5\u5546\u54c1\u6570\u91cf\u53ca\u5916\u89c2\u3002 2. \u5982\u6709\u5f02\u8bae\u8bf7 3 \u65e5\u5185\u8054\u7cfb\u3002</p>';
    } else if(type === 'acceptance'){
      footerText = '<p>\u5907\u6ce8\uff1a1. \u672c\u5355\u4e3a\u9879\u76ee\u9a8c\u6536\u51ed\u8bc1\u3002 2. \u7b7e\u5b57\u76d6\u7ae0\u540e\u751f\u6548\u3002</p>';
    }

    var signHtml = '';
    if(type === 'delivery'){
      signHtml = '<div class="doc-sign"><div><div class="line"></div>\u53d1\u8d27\u5355\u4f4d\uff08\u7b7e\u7ae0\uff09</div><div><div class="line"></div>\u8fd0\u8f93\u5355\u4f4d\uff08\u7b7e\u7ae0\uff09</div><div><div class="line"></div>\u6536\u8d27\u4eba\u7b7e\u6536</div></div>';
    } else if(type === 'acceptance'){
      signHtml = '<div class="doc-sign"><div><div class="line"></div>\u4f9b\u5e94\u5355\u4f4d\uff08\u7b7e\u7ae0\uff09</div><div><div class="line"></div>\u9a8c\u6536\u5355\u4f4d\uff08\u7b7e\u7ae0\uff09</div><div><div class="line"></div>\u65e5\u671f\uff1a'+ds+'</div></div>';
    } else {
      signHtml = '<div class="doc-sign"><div><div class="line"></div>\u4f9b\u5e94\u5546\uff08\u7b7e\u7ae0\uff09</div><div><div class="line"></div>\u5ba2\u6237\uff08\u7b7e\u7ae0\uff09</div><div><div class="line"></div>\u65e5\u671f\uff1a'+ds+'</div></div>';
    }

    var html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>'+t+' - '+esc(o.no)+'</title>'+
      '<style>'+document.querySelector('style').textContent+'</style></head><body>'+
      '<div class="doc-bar"><strong>'+t+'</strong><span style="flex:1"></span><button class="sec" onclick="window.close()">\u5173\u95ed</button><button onclick="window.print()">\u6253\u5370 / \u4fdd\u5b58 PDF</button></div>'+
      '<div class="doc-page"><div class="doc-frame">'+
      '<div class="doc-watermark">'+esc(info.name||'SPORT SHOPPING')+'</div>'+
      '<div class="doc-header-line"><b>'+esc(info.name||'\u4f9b\u5e94\u5546\u540d\u79f0')+'</b><span class="doc-ym">'+t+'</span></div>'+
      '<div style="text-align:center;margin:8mm 0"><h1 style="font-size:24px;letter-spacing:6px;margin:0">'+t+'</h1></div>'+
      '<div class="doc-meta"><div><div><b>\u5355\u636e\u7f16\u53f7\uff1a</b>'+esc(o.no)+'-'+type.substring(0,3).toUpperCase()+'</div><div><b>\u5236\u5355\u65e5\u671f\uff1a</b>'+ds+'</div><div><b>\u8ba2\u5355\u53f7\uff1a</b>'+esc(o.no)+'</div></div>'+
      '<div style="text-align:right"><div><b>\u5ba2\u6237\u540d\u79f0\uff1a</b>'+esc(o.username)+'</div><div><b>\u8054\u7cfb\u7535\u8bdd\uff1a</b>'+esc(addr.phone||'\u2014')+'</div><div><b>\u6536\u8d27\u5730\u5740\uff1a</b>'+receiver+'</div></div></div>'+
      itemsHtml +
      '<div class="doc-meta" style="margin-top:6mm"><div>'+
      (info.bankName ? '<div><b>\u5f00\u6237\u94f6\u884c\uff1a</b>'+esc(info.bankName)+'</div><div><b>\u94f6\u884c\u8d26\u53f7\uff1a</b>'+esc(info.bankAccount||'\u2014')+'</div>' : '')+
      (info.taxId ? '<div><b>\u7a0e\u53f7\uff1a</b>'+esc(info.taxId)+'</div>' : '')+
      '<div><b>\u8054\u7cfb\u7535\u8bdd\uff1a</b>'+esc(info.phone||'\u2014')+'</div>'+(info.contact?'<div><b>\u8054\u7cfb\u4eba\uff1a</b>'+esc(info.contact)+'</div>':'')+'</div>'+
      '<div class="doc-note">'+footerText+'</div>'+
      signHtml+'</div></div></body></html>'

      

    var w = window.open('', '_blank', 'width=900,height=700');
    w.document.write(html); w.document.close();
    setTimeout(function(){ w.focus(); }, 200);
  },

    db.companyInfo = { name: f.name.value.trim(), address: f.address.value.trim(), phone: f.phone.value.trim(), contact: f.contact.value.trim(), taxId: f.taxId.value.trim(), bankName: f.bankName.value.trim(), bankAccount: f.bankAccount.value.trim() };

  changeAdminPwd: async function(e){ e.preventDefault(); var f=e.target,a=currentAdmin(),old=f.old.value,p1=f.p1.value,p2=f.p2.value; if(!(await verifyCred(a,old))){ toast('\u539f\u5bc6\u7801\u9519\u8bef','err');return false; } if(p1.length<6||p1!==p2){ toast(p1!==p2?'\u4e24\u6b21\u65b0\u5bc6\u7801\u4e0d\u4e00\u81f4':'\u65b0\u5bc6\u7801\u81f3\u5c11 6 \u4f4d','err');return false; } var cred=await makeCred(p1);a.salt=cred.salt;a.hash=cred.hash;save();toast('\u5bc6\u7801\u5df2\u4fee\u6539','ok');render();return false; }
};
